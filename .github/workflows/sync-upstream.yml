name: sync-upstream

on:
  schedule:
    # Daily at 02:17 UTC; GitHub crons only run on the default branch.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream/master into master
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "master already contains upstream/master"
            exit 0
          fi
          # A merge conflict fails the job on purpose: resolve locally instead of force-pushing.
          git merge --no-edit upstream/master
          git push origin master
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Notify Feishu
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          SYNC_UPDATED: ${{ steps.sync.outputs.updated }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$SYNC_UPDATED" in
            true) outcome="synced: merged new upstream commits" ;;
            false) outcome="no-op: master already contains upstream/master" ;;
            *) outcome="failed before merge" ;;
          esac
          text="[${REPO}] sync-upstream ${JOB_STATUS} (${outcome}); run ${RUN_ID}"
          jq -n --arg text "$text" '{msg_type: "text", content: {text: $text}}' > payload.json
          curl -fsS -X POST -H "Content-Type: application/json" -d @payload.json "$FEISHU_WEBHOOK_URL"
